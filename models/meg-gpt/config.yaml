# Main Script Settings
main:
  run_dir: ./models/generator     # directory to save checkpoints and logs
  gpus: 2                         # number of GPUs to use (0 = CPU)
  precision: bf16-mixed           # precision level ("bf16-mixed", "16-mixed", 16, or 32)
  deterministic: False            # enable deterministic training (need to be False if BF16 ops are used)
  seed: 11                        # random seed
  checkpoint: null                # path to a pre-trained model checkpoint
  wandb:
    enabled: True                 # set to False to disable WandbLogger
    project: egpt_fm_datasets     # W&B project name
    name: v0_camcan_rest          # run name (null = auto-generated by W&B)
    watch_log: all                # log "gradients", "parameters", "all", or null to disable
    watch_log_freq: 1000          # log weights/gradients every N batches

# Dataset Settings
data_config:
  data_dir: /well/woolrich/projects/fm_datasets/tokenized/v0/train             # base dir; files resolved as {data_dir}/{session}.h5 (session = "camcan/sub-...")
  sessions_csv: ./manifest_train_camcan.csv                                    # train-only manifest (621 camcan rows), filtered from tokenized/v0/manifest.csv
  tokenizer_dir: /well/woolrich/projects/fm_datasets/tokenized/v0/model        # tokenizer + vocab.pkl
  sampling_frequency: 250                                                      # unit: Hz
  split_method: subject_window                                                 # per-subject window split
  label_cols: [session]                                                        # CSV cols emitted as {col}_labels (use [subject] or [subject, session])
  compute_label_inits: null                                                    # precomputed; set to e.g. [session_labels] to recompute at train time

# MEG-GPT Settings
model_config:

  # Meta data
  name: meg_gpt

  # Base config
  sequence_length: 100
  n_channels: 52

  # Input embedding config
  input_embedding:
    n_tokens: 66                  # if null, auto-filled at runtime from tokenizer vocab (len(total_token_counts) + 1)
    embedding_dim: 256
    token_embedding_dim: 256
    pos_embedding_dim: 256
    pos_embedding_type: absolute
    channel_embedding_dim: 256
    extra_label_specs:            # must match data_config.label_cols (name = "{col}_labels")
      - label_dim: 66             # n_tokens (set equal so init weights = per-class token-freq distribution)
        n_classes: 621            # number of unique sessions in the training set (621 camcan train sessions)
        name: session_labels
        init_weights: ./init_weights/session_labels.npy  # null to skip

  # Transformer decoder config
  transformer_decoder:
    n_heads: 4
    model_dim: 256
    n_patches_out: [25, 20, 10, 8, 16]
    patch_len_out: [4, 4, 8, 8, 1]
    n_patches_in: [100, 25, 20, 10, 8]
    patch_len_in: [1, 4, 4, 8, 8]
    unpatched_len_in: [0, 0, 0, 0, 0]
    l_unpatched_b: [null, null, null, null, null]
    l_patched_b: [8, null, null, null, null]
    do_chan_attention: [False, False, False, False, False]  # spatial (channel) attention disabled
    do_cross_attention: [False, False, False, False, False]
    chan_attention_mask: [null, null, null, null, null]

    full_channel_attention_dropout: 0.1
    channel_attention_channel_dropout: 0.1
    time_attention_channel_dropout: 0.0
    chan_attn_chandim: null
    feed_forward_dim: 1024
    feed_forward_activation: gelu
    dropout: 0.2
    norm_type: "layer"
    n_groups: null

  # Loss config
  loss:
    loss_sequence_length: 16
    top_k: [1, 5]
    label_smoothing: 0.0

  # Training config
  training:
    batch_size: 64  # batch size per GPU
    accumulate_grad_batches: 1  # effective batch = 64 * 2 GPUs * 1 = 128
    n_epochs: 1
    val_split: 0.1
    optimizer:
      name: adamw
      learning_rate: 1.0e-5
      weight_decay: 0.01
      betas: [0.9, 0.98]
      eps: 1.0e-8
    gradient_clip_val: 1.0
    lr_scheduler:
      name: cosine_annealing_with_warmup
      interval: step
      total_steps: 60520    # n_train_windows // (batch_size*gpus*accum) * n_epochs
      warmup_steps: 6052    # 10% of total_steps
      warmup_start_lr: 1.0e-7
      eta_min: 1.0e-6
    multi_gpu: True
